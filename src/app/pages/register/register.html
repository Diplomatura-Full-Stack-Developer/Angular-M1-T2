<div class="flex flex-col p-4 md:p-8 gap-4 md:gap-8">
  <h1 class="text-accent-700 text-3xl font-bold underline text-center text-shadow-md">
    {{ title }}
  </h1>
  <p class="text-accent-700 text-sm text-center">
    {{ description }}
  </p>
  <form
    [formGroup]="registerForm"
    (ngSubmit)="onSubmit()"
    class="flex flex-col p-4 md:p-8 gap-4 md:gap-8"
  >
    <label for="name">Nombre</label>
    <input
      type="text"
      id="name"
      formControlName="name"
      class="border border-gray-300 rounded-md p-2"
      [ngClass]="{
        'border-red-500': isInvalid('name'),
      }"
    />
    @if (errorMessage('name'); as error) {
      <p class="text-red-600 text-sm">{{ error }}</p>
    }

    <label for="email">Email</label>
    <input
      type="email"
      id="email"
      formControlName="email"
      class="border border-gray-300 rounded-md p-2"
      [ngClass]="{
        'border-red-500': isInvalid('email'),
      }"
    />
    @if (errorMessage('email'); as error) {
      <p class="text-red-600 text-sm">{{ error }}</p>
    }

    <label for="message">Mensaje</label>
    <input
      type="text"
      id="message"
      formControlName="message"
      class="border border-gray-300 rounded-md p-2"
      [ngClass]="{
        'border-red-500': isInvalid('message'),
      }"
    />
    @if (errorMessage('message'); as error) {
      <p class="text-red-600 text-sm">{{ error }}</p>
    }
    <button type="submit" class="bg-blue-500 text-white rounded-md p-2 cursor-pointer">
      Enviar
    </button>
  </form>
</div>
